{% load static %}

<nav class="sidebar sidebar-responsive">
    <div class="sidebar-link-container sidebar-link-home">
        <a href="{% url 'home' %}" class="sidebar-link">
            <img class="sidebar-image" alt="home" src="{% static 'images/home.png' %}" />
        </a>
        <span class="sidebar-tooltip-home tooltip">Home</span>
    </div>
    <div class="sidebar-link-container sidebar-link-books">
        <a href="{% url 'book_requests' %}" class="sidebar-link">
            <img class="sidebar-image" alt="books" src="{% static 'images/books.png' %}" />
        </a>
        <span class="sidebar-tooltip-books tooltip">Book Requests</span>
    </div>
    <div class="sidebar-link-container sidebar-link-fines">
        <a class="sidebar-link" href="{% url 'book_fines' %}">
            <img class="sidebar-image" alt="fines" src="{% static 'images/debit-card.png' %}" />
        </a>
        <span class="tooltip sidebar-tooltip-fines">Fines</span>
    </div>

    <div class="sidebar-link-container sidebar-link-logout">
        <!-- Using a form to handle logout with CSRF token -->
        <form action="{% url 'oidc_logout' %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="sidebar-link" style="background:none;border:none;padding:0;">
                <img class="sidebar-image" alt="logout" src="{% static 'images/logout.png' %}" />
            </button>
        </form>
        <span class="tooltip sidebar-tooltip-logout">Logout</span>
    </div>
        <!-- <a class="sidebar-link" href="">
            <img class="sidebar-image" alt="fines" src="{% static 'images/logout.png' %}" />
        </a>
        <span class="tooltip sidebar-tooltip-logout">Logout</span>
    </div> -->
</nav>
